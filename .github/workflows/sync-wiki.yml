name: Sync Wiki

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'repowiki/**'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Sync Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          strategy: 'init'
          wiki-folder: '.qoder/repowiki/zh'
          commit-message: 'Auto-sync wiki from .qoder/repowiki/zh folder'
